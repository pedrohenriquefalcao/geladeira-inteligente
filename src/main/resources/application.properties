spring.application.name=geladeira_inteligente
server.port=${PORT:8080}

# CONFIGURAÇÃO DO H2 EM MEMÓRIA
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:geladeiradb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# CONSOLE DO H2
spring.h2.console.path=/h2-console
spring.h2.console.settings.trace=false
spring.h2.console.settings.web-allow-others=true

# PROPRIEDADES JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# PROPRIEDADES FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# API LLM
llm.api.url=https://api.groq.com/openai/v1
llm.api.model=gpt-oss-20b
# Modelos reserva caso o principal falhe
llm.api.fallback-models=llama-3.1-8b-instant
GROQ_API_KEY=${GROQ_API_KEY:}