<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geladeira Inteligente</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>
<body>
<div class="container">
    <header>
        <div class="header-title">
            <h1>Geladeira Inteligente</h1>
            <p>Gerenciador inteligente de alimentos da sua geladeira</p>
        </div>
        <div class="header-actions">
            <button class="btn-success" onclick="abrirSidebarReceita()">
                <span class="icon">✨</span> Gerar Receita com meus Ingredientes
            </button>
        </div>
    </header>

    <div class="main-content">
        <div class="card">
            <h2>Adicionar Alimento</h2>
            <div id="formAlert" class="alert"></div>

            <form id="alimentoForm">
                <div class="form-group">
                    <label for="nome">Nome do Alimento *</label>
                    <input type="text" id="nome" name="nome" placeholder="Ex: Maçã Fuji" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="categoria">Categoria *</label>
                        <select id="categoria" name="categoria" required>
                            <option value="">Selecione uma categoria</option>
                            <option value="BEBIDAS">Bebidas</option>
                            <option value="LATICINIOS">Laticínios</option>
                            <option value="HORTIFRUTI">Hortifrúti</option>
                            <option value="CARNES E PEIXES">Carnes e Peixes</option>
                            <option value="EMBUTIDOS">Embutidos</option>
                            <option value="CONGELADOS">Congelados</option>
                            <option value="MOLHOS E CONDIMENTOS">Molhos e Condimentos</option>
                            <option value="SOBREMESAS">Sobremesas</option>
                            <option value="OVOS">Ovos</option>
                            <option value="SOBRAS">Sobras</option>
                            <option value="GRAOS">Grãos</option>
                            <option value="FRUTAS">Frutas</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="quantidade">Quantidade *</label>
                        <input type="number" id="quantidade" name="quantidade" min="1" placeholder="Ex: 2" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="validade">Data de Validade *</label>
                    <input type="date" id="validade" name="validade" required>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn-secondary" onclick="limparFormulario()">Limpar</button>
                    <button type="submit" class="btn-primary">Salvar Alimento</button>
                </div>
            </form>
        </div>

        <div class="card">
            <h2>Meus Alimentos</h2>
            <div id="listAlert" class="alert"></div>
            <div id="loadingList" class="loading">
                <div class="spinner"></div>
                <p>Buscando na geladeira...</p>
            </div>
            <div class="table-container">
                <div id="alimentosList"></div>
            </div>
        </div>
    </div>
</div>

<div id="sidebarOverlay" class="sidebar-overlay" onclick="fecharSidebarReceita()"></div>

<aside id="chatSidebar" class="sidebar">
    <div class="sidebar-header">
        <h2>👨‍🍳 Chef IA</h2>
        <span class="close-sidebar" onclick="fecharSidebarReceita()">&times;</span>
    </div>
    <div class="sidebar-content">
        <div id="loadingReceita" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p>Analisando seus ingredientes e criando uma receita...</p>
        </div>
        <div id="receitaContent">
            <div class="empty-chat">
                <p>Clique no botão acima para sugerir uma receita baseada no que você tem na geladeira.</p>
            </div>
        </div>
    </div>
</aside>

<script th:src="@{/js/home.js}"></script>
</body>
</html>
